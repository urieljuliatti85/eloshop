# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cancel_expired_orders:
    class: CancelExpiredOrdersJob
    queue: default
    schedule: every 15 minutes
  check_railway_metrics:
    class: CheckRailwayMetricsJob
    queue: default
    schedule: every 10 minutes
  # Cobre o webhook do Mercado Pago que não chegou: consulta o gateway para
  # pagamentos pending há mais de 10 minutos. Idempotente (usa ProcessWebhook).
  reconcile_payments:
    class: ReconcilePaymentsJob
    queue: default
    schedule: every 15 minutes
  # Procura sinais de vendedor irregular e avisa o admin por e-mail e Sentry.
  # Só notifica (Fraud::SellerScan); idempotente por vendedor e regra.
  seller_fraud_scan:
    class: SellerFraudScanJob
    queue: default
    schedule: every hour at minute 7
  # Um lembrete por carrinho esquecido (24h parado, cliente logado, sem cupom,
  # com descadastro). Idempotente: Cart#reminder_sent_at marca o envio.
  send_cart_reminders:
    class: SendCartRemindersJob
    queue: default
    schedule: every hour at minute 37
