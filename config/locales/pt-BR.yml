pt-BR:
  date:
    formats:
      short: "%d/%m/%Y"
  time:
    formats:
      short: "%d/%m/%Y às %H:%M"
  # `distance_of_time_in_words` não vem traduzido no Rails. Só as faixas que
  # o e-mail de redefinição de senha alcança (o token expira em horas).
  datetime:
    distance_in_words:
      less_than_x_minutes:
        one: "menos de um minuto"
        other: "menos de %{count} minutos"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      about_x_hours:
        one: "cerca de 1 hora"
        other: "cerca de %{count} horas"
      x_days:
        one: "1 dia"
        other: "%{count} dias"
  activerecord:
    attributes:
      user:
        email_address: "E-mail"
    errors:
      models:
        user:
          attributes:
            email_address:
              taken: "já está em uso"
  number:
    currency:
      format:
        unit: "R$"
        format: "%u %n"
        separator: ","
        delimiter: "."
        precision: 2
    format:
      separator: ","
      delimiter: "."
  orders:
    statuses:
      pending: "Aguardando pagamento"
      confirmed: "Confirmado"
      cancelled: "Cancelado"
  sellers:
    statuses:
      pending: "Em análise"
      approved: "Aprovado"
      suspended: "Suspenso"
  products:
    statuses:
      draft: "Rascunho"
      active: "Publicado"
      sold_out: "Esgotado"
      discontinued: "Descontinuado"
  seller_orders:
    statuses:
      pending: "Pendente"
      confirmed: "Confirmado"
      cancelled: "Cancelado"
      partially_refunded: "Reembolso parcial"
      refunded: "Reembolsado"
