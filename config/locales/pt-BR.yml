pt-BR:
  flash:
    success:
      title: "Sucesso!"
      close: "Fechar mensagem de sucesso"
    error:
      title: "Algo deu errado"
      close: "Fechar mensagem de erro"
  date:
    formats:
      short: "%d/%m/%Y"
  time:
    formats:
      short: "%d/%m/%Y às %H:%M"
  # `distance_of_time_in_words` não vem traduzido no Rails. Só as faixas que
  # o e-mail de redefinição de senha alcança (o token expira em horas).
  datetime:
    distance_in_words:
      less_than_x_minutes:
        one: "menos de um minuto"
        other: "menos de %{count} minutos"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      about_x_hours:
        one: "cerca de 1 hora"
        other: "cerca de %{count} horas"
      x_days:
        one: "1 dia"
        other: "%{count} dias"
  # O projeto não usa a gem rails-i18n: sem estas chaves, toda validação
  # padrão do Rails ("can't be blank", "must exist"...) aparece em inglês.
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "deve ser aceito"
      blank: "não pode ficar em branco"
      confirmation: "não é igual a %{attribute}"
      empty: "não pode ficar vazio"
      equal_to: "deve ser igual a %{count}"
      even: "deve ser par"
      exclusion: "não está disponível"
      greater_than: "deve ser maior que %{count}"
      greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
      in: "deve estar entre %{count}"
      inclusion: "não está incluído na lista"
      invalid: "não é válido"
      less_than: "deve ser menor que %{count}"
      less_than_or_equal_to: "deve ser menor ou igual a %{count}"
      model_invalid: "A validação falhou: %{errors}"
      not_a_number: "não é um número"
      not_an_integer: "deve ser um número inteiro"
      odd: "deve ser ímpar"
      other_than: "deve ser diferente de %{count}"
      present: "deve ficar em branco"
      required: "é obrigatório"
      taken: "já está em uso"
      too_long:
        one: "é muito longo (máximo de 1 caractere)"
        other: "é muito longo (máximo de %{count} caracteres)"
      too_short:
        one: "é muito curto (mínimo de 1 caractere)"
        other: "é muito curto (mínimo de %{count} caracteres)"
      wrong_length:
        one: "não tem o tamanho esperado (1 caractere)"
        other: "não tem o tamanho esperado (%{count} caracteres)"
  activerecord:
    attributes:
      user:
        email_address: "E-mail"
      cart_item:
        product: "Produto"
      product:
        name: "Nome"
        slug: "URL"
        description: "Descrição"
        price: "Preço"
        price_cents: "Preço"
        currency: "Moeda"
        sku: "SKU"
        stock_quantity: "Estoque"
        status: "Situação"
        availability_type: "Disponibilidade"
        production_time_min_days: "Produção mínima"
        production_time_max_days: "Produção máxima"
        category: "Categoria"
        seller: "Artesão"
        weight_grams: "Peso"
        length_cm: "Comprimento"
        width_cm: "Largura"
        height_cm: "Altura"
        main_image: "Imagem principal"
        images: "Galeria de imagens"
        fixed_shipping: "Valor do frete fixo"
        fixed_shipping_cents: "Valor do frete fixo"
        fixed_shipping_estimated_days: "Prazo do frete fixo"
      category:
        products: "produtos"
      product_variant:
        product: "Produto"
        sku: "SKU"
        price_cents: "Preço"
        stock_quantity: "Estoque"
        size: "Tamanho"
        color: "Cor"
        material: "Material"
      personalization_option:
        product: "Produto"
        label: "Nome do campo"
        max_length: "Tamanho máximo"
      order_message:
        body: "Mensagem"
        sender: "Remetente"
        seller_order: "Pedido"
    errors:
      messages:
        record_invalid: "A validação falhou: %{errors}"
        restrict_dependent_destroy:
          has_one: "Não é possível excluir o registro porque existe um(a) %{record} dependente"
          has_many: "Não é possível excluir o registro porque existem %{record} dependentes"
      models:
        user:
          attributes:
            email_address:
              taken: "já está em uso"
        order_message:
          attributes:
            body:
